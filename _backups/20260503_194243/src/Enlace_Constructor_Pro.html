  --btn-b-border:#9ab8d8;

  --btn-em-color:#5a3a9a;
  --btn-em-border:#b8a8d8;
  --btn-d-color:#c02020;
  --btn-d-border:#e0a0a0;
  --bdg-comp-bg:#d0f0e2;--bdg-comp-fg:#0a6640;

  --email-warn-bg:#fff0f0;--email-warn-border:#f0c0c0;
  --kpi-alert:#fff8e8;--kpi-alert-bd:#f5dfa0;
  --kpi-pend:#e8f4ff; --kpi-pend-bd:#a0c8f0;
  --kpi-prog:#e8fff2; --kpi-prog-bd:#a0e0c0;
  --kpi-rech:#fff0f2; --kpi-rech-bd:#f0a0b0;
  --navG-color:rgba(255,255,255,0.55);
  --sb-text:#ffffff;
}
/* Sidebar en tema claro — textos blancos sobre azul acero */
body[data-theme="light"] .ecp-nb-label{color:rgba(255,255,255,0.9);}
body[data-theme="light"] [data-sidebar] button{color:rgba(255,255,255,0.85) !important;}
body[data-theme="light"] [data-sidebar] button:hover{background:rgba(255,255,255,0.12) !important;}

body{background:var(--bg);font-family:'DM Sans',sans-serif;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--scroll-track);}
::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:3px;}
.toast-enter{animation:slideIn .3s ease;}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
.notif-badge{position:absolute;top:-4px;right:-4px;background:#e05454;color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
.mat-row:hover{background:var(--hover)!important;}

    @media print { .no-print { display: none !important; } }
